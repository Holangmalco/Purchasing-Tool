name: Keep Streamlit App Awake

on:
  schedule:
    # 매 6시간마다 실행 (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # GitHub Actions 탭에서 수동 실행 가능

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit Cloud App
        run: |
          echo "Pinging Streamlit Cloud app to prevent sleeping..."
          RESPONSE=$(curl -s -L -w "%{http_code}" -o /dev/null "https://iacf-purchasing.streamlit.app/%EA%B5%AC%EB%A7%A4%EC%B6%94%EC%B6%9C%EA%B8%B0")
          echo "HTTP Status Code: $RESPONSE"
          if [ "$RESPONSE" -ge 200 ] && [ "$RESPONSE" -lt 400 ]; then
            echo "Successfully pinged app. Status: $RESPONSE"
          else
            echo "Warning: Received HTTP status $RESPONSE"
          fi
